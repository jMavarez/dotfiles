set -s escape-time 0
set-option -g focus-events on
set-window-option -g mode-keys vi
set-option -g set-clipboard on
set-option -g renumber-windows on
set-option -g allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
#set -ga terminal-features ",xterm-ghostty:RGB"

unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

bind r source-file ~/.config/tmux/tmux.conf

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

set -g @accent "colour250"

set -g status-style bg=default
set -g status-left "#[fg=black,bg=#{@accent},bold] #S "
set -g status-right "#[fg=black,bg=#{@accent},bold] %d %a %b %H:%M "
set -g window-status-format "#[fg=#{@accent},bg=default] #I #[fg=white,bg=default]#W "
set -g window-status-current-format "#[fg=#{@accent},bg=default,bold] #I #W "
